# Agent config for jenkins (CentOS Stream 9). Install as /etc/mp-infra/agent.yaml, mode 0600.
host: jenkins
server_url: "http://TAILNET_IP_OF_SERVE:8099"
token: "PASTE_TOKEN_FROM_mpinfra_token"

disks: ["/"]
firewall:
  cmd: ["firewall-cmd", "--list-all"]
security_updates: dnf
versions:
  - name: jenkins
    cmd: ["rpm", "-q", "--qf", "%{VERSION}", "jenkins"]
    min: "MIN_JENKINS_VERSION"
auth_failures:
  warn_per_ip: 100   # one IP this often in 24 h is a brute force: warn
  sources:
    - name: ssh
      cmd: ["journalctl", "-u", "sshd", "--since", "-24h", "--no-pager", "-o", "cat"]
      pattern: '(?:Failed password|Invalid user) .* from (?P<ip>[0-9a-fA-F.:]+)'

# Successful SSH logins. One from outside the tailnet (and allow) is crit.
logins:
  allow: []    # extra CIDRs you log in from without Tailscale, e.g. ["OFFICE_IP/32"]
  sources:
    - name: ssh
      cmd: ["journalctl", "-u", "sshd", "--since", "-24h", "--no-pager", "-o", "short-iso"]
      pattern: '^(?P<time>\S+) \S+ sshd\[\d+\]: Accepted \S+ for (?P<user>\S+) from (?P<ip>[0-9a-fA-F.:]+)'   # "time": the summary says how long ago

# Admin accounts, sudoers and SSH authorized_keys: any change is crit until accepted
# in the UI. Listening TCP ports: a change is warn until accepted.
accounts: true
listeners: true
