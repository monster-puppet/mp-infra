# Example server config. The real file is /etc/mp-infra/config.yaml and is never committed.
# Secrets are referenced by env var name only (*_env keys). Every threshold below is
# optional; the values shown are the defaults from docs/spec.md.

ui_addr: "TAILNET_IP:8098"      # UI, members only
report_addr: "TAILNET_IP:8099"  # report API, all reporting hosts
db: /var/lib/mp-infra/mpinfra.db
stale_after: 15m
endpoint_stale_after: 168h   # endpoint hosts (workstations): 7 days
probe_interval: 5m
base_url: "http://TAILNET_IP:8098"   # for links in alerts

hosts:
# name is the host's identity (agent config, report token, check ids) and never
# changes. label is what the UI shows instead; os picks its icon: rocky, centos,
# ubuntu, debian, linux or windows. Both are optional, and both can be set in the
# UI (pencil on the host card); what is set there wins over this file.
  - name: monster-p4
    label: "Perforce"
    os: rocky
    public_ip: "PUBLIC_IP"
    expected_public_ports: [22, 80, 443]
  - name: jenkins
    label: "Jenkins"
    os: centos
    public_ip: "PUBLIC_IP"
    expected_public_ports: [22, 80, 443, 50001]
  - name: jenkins-win
    label: "Windows build agent"
    os: windows
    public_ip: "PUBLIC_IP"
    expected_public_ports: []
  # Phase 3. Until it joins the tailnet:
  # - name: p4-game
  #   os: ubuntu
  #   public_ip: "PUBLIC_IP"
  #   expected_public_ports: [22, 1666]
  #   not_on_tailnet: true
  # A workstation that reports through the MP Launcher: no token (the report API
  # knows it by its tailnet address), stale only after endpoint_stale_after, no
  # ts.online / ts.key_expiry. The tailnet device is matched by hostname, or map it
  # under tailscale.devices.
  # - name: tacco-pc
  #   label: "Marcus's PC"
  #   os: windows-client
  #   endpoint: true

# Connections hosts make to each other, drawn as arcs on the network map with an
# arrow at the host connected to. They are declared here, not observed. check
# names a check on either end (or on serve) that colours the arc; without one it
# stays grey. public: the route goes over the internet, so the arc is drawn on
# that side. label replaces the port on the arc (at most 12 characters).
links:
  - from: jenkins
    to: monster-p4
    port: 1666
  - from: jenkins-win
    to: jenkins
    port: 50001
    public: true                 # the agent uses the public Jenkins URL on purpose
    check: jenkins.agent.windows

# Ports connect-scanned on every public_ip, plus each host's expected ports.
# scan_ports: [21, 22, 23, 25, 53, 80, 443, 1666, 3389, 5985, 8080, 50000, 50001]

thresholds:
  ts_online_warn: 5m
  ts_online_crit: 15m
  ts_key_expiry_days: 14
  ts_device_unseen_days: 30
  jenkins_offline_grace: 5m
  breakglass_max_age: 840h      # 35 days
  tls_warn_days: 21
  tls_crit_days: 7
  snapshot_warn_days: 35
  snapshot_crit_days: 60
  updates_crit_age: 336h        # 14 days
  bruteforce_active: 30         # new failed logins between two reports = active brute force
  endpoint_av_sig_days: 3       # Defender signatures older than this warn
  endpoint_screen_lock_secs: 900  # no screen lock within this warns
  endpoint_min_build: 26200     # Windows 11 25H2; older builds are out of support: crit
  endpoint_update_age: 1080h    # 45 days without an installed update warns

tls:
  - name: code-review
    url: "https://CODE_REVIEW_HOST/"
  - name: jenkins
    url: "https://JENKINS_HOST/"

dns:
  - name: jenkins
    host: "JENKINS_HOST"
    expected: ["PUBLIC_IP"]

http:
  - name: code-review
    url: "https://CODE_REVIEW_HOST/"
  # The public website (Framer). The apex 308s to www; www must serve the real page.
  # Crit (Slack at once) when the name stops resolving, the redirect points
  # elsewhere, or a parked/wrong page answers instead.
  - name: website-apex
    url: "https://WEBSITE_DOMAIN/"
    location: "https://www.WEBSITE_DOMAIN/"
  - name: website
    url: "https://www.WEBSITE_DOMAIN/"
    status: 200
    contains: "WEBSITE_TITLE_TEXT"

tcp:
  - name: p4
    addr: "TAILNET_IP_OF_MONSTER_P4:1666"

tailscale:
  client_id_env: MPINFRA_TS_CLIENT_ID
  client_secret_env: MPINFRA_TS_CLIENT_SECRET
  tailnet: "-"
  devices:                       # host name -> Tailscale device hostname, when they differ
    jenkins-win: "WINDOWS_DEVICE_HOSTNAME"
  expected_devices: []           # laptops, phones: anything else shows in ts.devices

jenkins:
  url: "https://JENKINS_HOST/"
  user: mpinfra
  token_env: MPINFRA_JENKINS_TOKEN
  agents: [windows]
  agent_hosts:
    windows: jenkins-win
  breakglass_job: break-glass-windows-tailscale
  breakglass_host: jenkins-win
  breakglass_monthly: true       # starts an ACTION=status build when the last success is 28 days old

digitalocean:
  token_env: MPINFRA_DO_TOKEN
  droplets:
    - name: monster-p4
      id: 0                      # droplet id
    - name: jenkins
      id: 0

notion:
  token_env: MPINFRA_NOTION_TOKEN
  database_id: "OPSEC_DATABASE_ID"
  done_property: "Done"

# Vendors' public security feeds -> notice.<name> checks on serve. No credentials.
# With no feeds listed, the built-in list is read (exe.dev, Tailscale, Jenkins,
# PHP 8.3, Let's Encrypt incidents, DigitalOcean trust-security posts).
notices:
  enabled: true
  jenkins_warnings: true      # match the update centre's warnings to installed plugins (uses jenkins:)
  # kev_products: [jenkins, perforce, php, "apache http server", nginx, openssh, tailscale]
  # feeds:
  #   - {name: exe-dev, url: "https://exe.dev/security/atom.xml", state: crit}
  #   - {name: php, url: "https://www.php.net/releases/feed.php", state: warn, tag: security, title: '^PHP 8\.3\.'}

alerts:
  slack_webhook_env: MPINFRA_SLACK_WEBHOOK
  smtp_host: "SMTP_HOST"
  smtp_port: 587
  smtp_user: "SMTP_USER"
  smtp_password_env: MPINFRA_SMTP_PASSWORD
  mail_from: "mpinfra@EXAMPLE_DOMAIN"
  mail_to: ["ALERT_ADDRESS"]
  deadman_url_env: MPINFRA_DEADMAN_URL
  crit_reminder: 12h
  digest_at: "08:00"

report_tokens_env: MPINFRA_REPORT_TOKENS

# Read-only MCP endpoint at /mcp on the UI port, for Claude Code and other agents
# (docs/mcp.md). The env var holds "client=sha256hex,..." from `mpinfra token`.
# Unset or empty: no /mcp.
mcp_tokens_env: MPINFRA_MCP_TOKENS

# Google sign-in on top of the tailnet (docs/deploy.md §8). Needs an https base_url,
# e.g. ui_addr: "127.0.0.1:8098" behind `tailscale serve`, and
# base_url: "https://MONITOR_HOST.TAILNET_NAME.ts.net". Redirect URI to register
# with Google: base_url + /auth/callback. /healthz and /api/status.json stay open.
# google_login:
#   client_id: "GOOGLE_CLIENT_ID.apps.googleusercontent.com"
#   client_secret_env: MPINFRA_GOOGLE_CLIENT_SECRET
#   session_key_env: MPINFRA_SESSION_KEY     # 32+ chars; `mpinfra token` prints one
#   allowed_domain: "EXAMPLE_DOMAIN"         # Google Workspace domain (hd claim)
#   allowed_emails: []                       # extra accounts outside the domain
#   session_ttl: 168h
